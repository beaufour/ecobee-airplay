[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecobee-airplay"
version = "0.1.0"
description = "Discover Ecobee AirPlay receivers and stream arbitrary audio to them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pyatv>=0.18,<0.19",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Home Automation",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
ecobee-airplay = "ecobee_airplay.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.13,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecobee_airplay"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
